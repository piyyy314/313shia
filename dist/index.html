
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#020617">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/index-DNQAVZS-.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-WuIFLT5A.css">
</head>
<body>
  <div class="crt-overlay"></div>
  <div class="crt-vignette"></div>
  <div class="crt-flicker"></div>
  <div id="error-box" style="position:fixed; z-index:999999; background:red; color:white; padding:20px; font-family:monospace; display:none; top:0; left:0; right:0; max-height:100vh; overflow:auto;"></div>
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      const errBox = document.getElementById('error-box');
      if (errBox) {
        errBox.style.display = 'block';
        errBox.innerHTML = `<h3>Uncaught Runtime Error</h3>
          <b>Message:</b> ${message}<br/>
          <b>Source:</b> ${source}:${lineno}:${colno}<br/>
          <b>Stack:</b> <pre>${error ? error.stack : 'No stack available'}</pre>`;
      }
    };
    window.addEventListener('unhandledrejection', function(event) {
      const errBox = document.getElementById('error-box');
      if (errBox) {
        errBox.style.display = 'block';
        errBox.innerHTML += `<h3>Unhandled Promise Rejection</h3>
          <b>Reason:</b> ${event.reason}`;
      }
    });
  </script>
  <div id="root"></div>
</body>
</html>
